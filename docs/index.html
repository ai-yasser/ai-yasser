<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#090d16">
  <meta name="description" content="An interactive, cursor-responsive hairline figure for Muhammad Yasser's GitHub profile.">
  <title>Figure · Muhammad Yasser</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #090d16; }
    canvas { display: block; width: 100%; height: 100%; touch-action: none; background: radial-gradient(ellipse at center, #1a233c 0%, #101724 55%, #090d16 100%); }
  </style>
</head>
<body>
  <canvas id="figure" role="img" aria-label="Dark hairline contours follow your cursor, rippling around a luminous center."></canvas>
  <script>
    (() => {
      'use strict';
      const canvas = document.querySelector('#figure');
      const gl = canvas.getContext('webgl', { alpha: false, antialias: false, powerPreference: 'low-power' });
      if (!gl) {
        // The canvas background is deliberately kept as the no-WebGL fallback.
        return;
      }

      const vertex = `
        attribute vec2 position;
        void main() { gl_Position = vec4(position, 0.0, 1.0); }
      `;
      const fragment = `
        precision mediump float;
        uniform vec2 resolution;
        uniform vec2 pointer;
        uniform float time;

        void main() {
          vec2 uv = (gl_FragCoord.xy - 0.5 * resolution) / min(resolution.x, resolution.y);
          vec2 target = pointer * vec2(resolution.x / min(resolution.x, resolution.y), resolution.y / min(resolution.x, resolution.y));
          vec2 p = uv - target;
          float angle = atan(p.y, p.x);
          float distanceToCenter = length(p);
          float ripple = 0.012 * sin(9.0 * angle + 2.0 * time) * exp(-distanceToCenter * 1.4);
          float radius = length(vec2(p.x * 0.84 + p.y * 0.17, p.y * 1.17)) + ripple;

          vec3 color = mix(vec3(0.035, 0.051, 0.086), vec3(0.082, 0.115, 0.19), exp(-distanceToCenter * 2.0));
          float glow = exp(-distanceToCenter * 7.0);
          color += vec3(0.025, 0.085, 0.13) * glow;

          float dotGrid = (1.0 - smoothstep(0.012, 0.036, length(fract(gl_FragCoord.xy / 32.0) - 0.5))) * 0.055;
          color += vec3(0.17, 0.28, 0.42) * dotGrid;

          for (int i = 1; i <= 21; i++) {
            float ring = float(i) * 0.057;
            float edge = abs(radius - ring);
            float hairline = 1.0 - smoothstep(0.0009, 0.0025, edge);
            float fade = 0.32 + 0.68 * exp(-ring * 0.95);
            vec3 ink = mix(vec3(0.39, 0.55, 0.86), vec3(0.51, 0.81, 0.98), 0.5 + 0.5 * sin(angle * 1.2 + ring * 3.0));
            color += ink * hairline * fade * 0.43;
          }

          float core = 1.0 - smoothstep(0.003, 0.008, distanceToCenter);
          color += vec3(0.49, 0.81, 1.0) * core;
          float vignette = 1.0 - 0.22 * smoothstep(0.4, 1.8, length(uv));
          gl_FragColor = vec4(color * vignette, 1.0);
        }
      `;

      function shader(type, source) {
        const result = gl.createShader(type);
        gl.shaderSource(result, source);
        gl.compileShader(result);
        if (!gl.getShaderParameter(result, gl.COMPILE_STATUS)) {
          console.error(gl.getShaderInfoLog(result));
          gl.deleteShader(result);
          return null;
        }
        return result;
      }

      const vs = shader(gl.VERTEX_SHADER, vertex);
      const fs = shader(gl.FRAGMENT_SHADER, fragment);
      if (!vs || !fs) return;
      const program = gl.createProgram();
      gl.attachShader(program, vs);
      gl.attachShader(program, fs);
      gl.linkProgram(program);
      gl.deleteShader(vs);
      gl.deleteShader(fs);
      if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
        console.error(gl.getProgramInfoLog(program));
        return;
      }
      gl.useProgram(program);
      const buffer = gl.createBuffer();
      gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
      gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
      const position = gl.getAttribLocation(program, 'position');
      gl.enableVertexAttribArray(position);
      gl.vertexAttribPointer(position, 2, gl.FLOAT, false, 0, 0);
      const resolution = gl.getUniformLocation(program, 'resolution');
      const pointer = gl.getUniformLocation(program, 'pointer');
      const time = gl.getUniformLocation(program, 'time');
      const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
      let targetX = 0;
      let targetY = 0;
      let x = 0;
      let y = 0;
      let frame = 0;
      let lastDraw = 0;

      function resize() {
        const dpr = Math.min(window.devicePixelRatio || 1, 1.5, 1600 / Math.max(canvas.clientWidth, canvas.clientHeight));
        canvas.width = Math.round(canvas.clientWidth * dpr);
        canvas.height = Math.round(canvas.clientHeight * dpr);
        gl.viewport(0, 0, canvas.width, canvas.height);
        if (reducedMotion.matches) draw(0);
      }

      function draw(now) {
        frame = 0;
        if (!reducedMotion.matches && now - lastDraw < 1000 / 30) {
          frame = requestAnimationFrame(draw);
          return;
        }
        lastDraw = now;
        if (!reducedMotion.matches) {
          x += (targetX - x) * 0.075;
          y += (targetY - y) * 0.075;
        }
        gl.uniform2f(resolution, canvas.width, canvas.height);
        gl.uniform2f(pointer, x, y);
        gl.uniform1f(time, reducedMotion.matches ? 0 : now * 0.00025);
        gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
        if (!reducedMotion.matches && !document.hidden) frame = requestAnimationFrame(draw);
      }

      canvas.addEventListener('pointermove', (event) => {
        if (reducedMotion.matches) return;
        const rect = canvas.getBoundingClientRect();
        targetX = (event.clientX - rect.left - rect.width / 2) / Math.min(rect.width, rect.height);
        targetY = (rect.height / 2 - (event.clientY - rect.top)) / Math.min(rect.width, rect.height);
      });
      canvas.addEventListener('pointerleave', () => { targetX = 0; targetY = 0; });
      window.addEventListener('resize', resize);
      document.addEventListener('visibilitychange', () => {
        if (document.hidden) {
          cancelAnimationFrame(frame);
          frame = 0;
        }
        else if (!frame) frame = requestAnimationFrame(draw);
      });
      reducedMotion.addEventListener('change', () => {
        cancelAnimationFrame(frame);
        targetX = x = 0;
        targetY = y = 0;
        frame = requestAnimationFrame(draw);
      });
      resize();
      frame = requestAnimationFrame(draw);
    })();
  </script>
</body>
</html>
